version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ashish
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: ecomdb
      TZ: Asia/Kolkata
    command: -c timezone='Asia/Kolkata'
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    depends_on:
      - redis
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      JWT_SECRET: defaultDevSecretMustBeAtLeast32CharactersLongForHS256!
      USER_SERVICE_URL: http://host.docker.internal:8081
      PRODUCT_SERVICE_URL: http://host.docker.internal:8082
      ORDER_SERVICE_URL: http://host.docker.internal:8083
      NOTIFICATION_SERVICE_URL: http://host.docker.internal:8084
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: INFO
      GATEWAY_LOG_LEVEL: DEBUG
  
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    depends_on:
      - postgres
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ecomdb
      DB_USER: ashish
      DB_PASSWORD: password123
      JWT_SECRET: defaultDevSecretMustBeAtLeast32CharactersLongForHS256!
  
  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: product-service
    depends_on:
      - postgres
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ecomdb
      DB_USER: ashish
      DB_PASSWORD: password123
  
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    depends_on:
      - postgres
      - kafka
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ecomdb
      DB_USER: ashish
      DB_PASSWORD: password123
      KAFKA_SERVERS: kafka:9092
  
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    depends_on:
      - postgres
      - kafka
    ports:
      - "8084:8084"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ecomdb
      DB_USER: ashish
      DB_PASSWORD: password123
      KAFKA_SERVERS: kafka:9092

volumes:
  postgres_data: